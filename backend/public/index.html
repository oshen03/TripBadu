<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TripBadu Admin Panel</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        header { background-color: #2E7D32; color: white; padding: 20px; text-align: center; border-radius: 8px; margin-bottom: 20px; }
        h2 { color: #2E7D32; margin-top: 30px; }
        table { width: 100%; border-collapse: collapse; background-color: white; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 30px; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #eee; }
        th { background-color: #2E7D32; color: white; }
        tr:hover { background-color: #f1f8e9; }
        .refresh-btn { background-color: #2E7D32; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; float: right; margin-bottom: 10px; font-weight: bold; }
        .btn-approve { background-color: #388E3C; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; margin-right: 5px; }
        .btn-reject { background-color: #D32F2F; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

<header style="display: flex; align-items: center; justify-content: center; gap: 20px;">
    <img src="/images/logo.png" alt="TripBadu Logo" style="width: 80px; height: 80px; background: white; border-radius: 50%; padding: 4px; box-shadow: 0 2px 6px rgba(0,0,0,0.2);">
    <div>
        <h1 style="margin: 0;">TripBadu Admin Dashboard</h1>
        <p style="margin: 5px 0 0 0;">Transaction History, Rental Bookings & VIP Ad Moderation</p>
    </div>
</header>

<button class="refresh-btn" onclick="refreshAll()">Refresh Data</button>

<h2>Orders & Transactions</h2>
<table id="orderTable">
    <thead>
        <tr>
            <th>ID</th>
            <th>Customer</th>
            <th>Email</th>
            <th>Total (LKR)</th>
            <th>Items</th>
            <th>Date</th>
        </tr>
    </thead>
    <tbody id="orderBody">
        <tr><td colspan="6" style="text-align:center;">No orders placed yet.</td></tr>
    </tbody>
</table>

<h2>Pending VIP Advertisements</h2>
<table id="adTable">
    <thead>
        <tr>
            <th>ID</th>
            <th>Item Name</th>
            <th>Owner Email</th>
            <th>Price (LKR/Day)</th>
            <th>Status</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody id="adBody">
        <tr><td colspan="6" style="text-align:center;">No pending ads.</td></tr>
    </tbody>
</table>

<script>
    async function fetchOrders() {
        try {
            const response = await fetch('/api/admin/orders');
            const orders = await response.json();
            const tableBody = document.getElementById('orderBody');
            tableBody.innerHTML = '';

            if (orders.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="6" style="text-align:center;">No orders placed yet.</td></tr>';
                return;
            }

            orders.forEach(order => {
                const row = document.createElement('tr');
                const itemsList = order.items ? order.items.map(i => i.name).join(', ') : 'N/A';
                row.innerHTML = `
                    <td>${order.id}</td>
                    <td>${order.customerName || 'N/A'}</td>
                    <td>${order.email || 'N/A'}</td>
                    <td>${(order.totalAmount || 0).toFixed(2)}</td>
                    <td>${itemsList}</td>
                    <td>${order.date || ''}</td>
                `;
                tableBody.appendChild(row);
            });
        } catch (error) {
            console.error('Error fetching orders:', error);
        }
    }

    async function fetchPendingAds() {
        try {
            const response = await fetch('/api/admin/ads/pending');
            const ads = await response.json();
            const tableBody = document.getElementById('adBody');
            tableBody.innerHTML = '';

            if (ads.length === 0) {
                tableBody.innerHTML = '<tr><td colspan="6" style="text-align:center;">No pending ads.</td></tr>';
                return;
            }

            ads.forEach(ad => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${ad.id}</td>
                    <td>${ad.name}</td>
                    <td>${ad.ownerEmail || 'N/A'}</td>
                    <td>${(ad.price || 0).toFixed(2)}</td>
                    <td><span style="color: #F57C00; font-weight: bold;">${ad.status}</span></td>
                    <td>
                        <button class="btn-approve" onclick="approveAd(${ad.id})">Approve</button>
                        <button class="btn-reject" onclick="rejectAd(${ad.id})">Reject</button>
                    </td>
                `;
                tableBody.appendChild(row);
            });
        } catch (error) {
            console.error('Error fetching pending ads:', error);
        }
    }

    async function approveAd(id) {
        try {
            const res = await fetch(`/api/admin/ads/${id}/approve`, { method: 'PUT' });
            if (res.ok) {
                alert('Ad approved successfully!');
                fetchPendingAds();
            }
        } catch (err) {
            console.error(err);
        }
    }

    async function rejectAd(id) {
        try {
            const res = await fetch(`/api/admin/ads/${id}`, { method: 'DELETE' });
            if (res.ok) {
                alert('Ad rejected.');
                fetchPendingAds();
            }
        } catch (err) {
            console.error(err);
        }
    }

    function refreshAll() {
        fetchOrders();
        fetchPendingAds();
    }

    refreshAll();
    setInterval(refreshAll, 10000);
</script>

</body>
</html>
